<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — Orbit</title>
    <style>
      :root {
        --bg: #0b0f19;
        --card: rgba(17, 24, 39, 0.78);
        --border: rgba(255, 255, 255, 0.1);
        --text: #f9fafb;
        --muted: #9ca3af;
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --input-bg: rgba(255, 255, 255, 0.04);
        --focus-ring: #6366f159;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter,
          sans-serif;
        background:
          radial-gradient(
            circle at 15% 20%,
            rgba(99, 102, 241, 0.22),
            transparent 40%
          ),
          radial-gradient(
            circle at 85% 80%,
            rgba(16, 185, 129, 0.14),
            transparent 40%
          ),
          var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      .login-card {
        width: 100%;
        max-width: 410px;
        background: var(--card);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 2.25rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        margin-bottom: 1.75rem;
      }

      .brand-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, #6366f1, #22d3ee);
        display: grid;
        place-items: center;
        font-weight: 700;
        color: #fff;
        font-size: 1rem;
      }

      .brand-name {
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        margin-bottom: 0.4rem;
      }

      .subtitle {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 1.75rem;
      }

      .form-group {
        margin-bottom: 1.15rem;
      }

      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 500;
        color: #e5e7eb;
        margin-bottom: 0.45rem;
      }

      .label-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .link {
        color: #818cf8;
        text-decoration: none;
        font-size: 0.82rem;
        font-weight: 500;
        transition: color 0.15s ease;
      }

      .link:hover {
        color: #a5b4fc;
        text-decoration: underline;
      }

      input[type="text"],
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 0.72rem 0.9rem;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--input-bg);
        color: var(--text);
        font-size: 0.95rem;
        outline: none;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      input::placeholder {
        color: #6b7280;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--focus-ring);
      }

      .remember-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0.25rem 0 1.4rem;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .remember-row input[type="checkbox"] {
        accent-color: var(--primary);
        width: 15px;
        height: 15px;
        cursor: pointer;
      }

      .btn-primary {
        width: 100%;
        padding: 0.78rem 1rem;
        border: none;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.15s ease,
          transform 0.08s ease;
      }

      .btn-primary:hover {
        background: var(--primary-hover);
      }

      .btn-primary:active {
        transform: scale(0.99);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 1.5rem 0;
        color: var(--muted);
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      .social-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
      }

      .btn-social {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.65rem 0.8rem;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--input-bg);
        color: var(--text);
        font-size: 0.88rem;
        font-weight: 500;
        text-decoration: none;
        transition:
          background 0.15s ease,
          border-color 0.15s ease;
      }

      .btn-social:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .footer-text {
        margin-top: 1.6rem;
        text-align: center;
        font-size: 0.86rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="login-card">
      <div class="brand">
        <div class="brand-icon">O</div>
        <span class="brand-name">Orbit</span>
      </div>

      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your account to continue</p>

      <form action="#" method="post">
        <div class="form-group">
          <label for="username">Email or username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="you@example.com"
            autocomplete="username"
            required
            autofocus
          />
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">Password</label>
            <a href="#" class="link">Forgot password?</a>
          </div>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>

        <label class="remember-row">
          <input type="checkbox" name="rememberMe" />
          <span>Keep me signed in</span>
        </label>

        <button type="submit" class="btn-primary">Sign in</button>
      </form>

      <div class="divider">or continue with</div>

      <div class="social-grid">
        <a href="#" class="btn-social">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M12 2C6.48 2 2 6.58 2 12.26c0 4.52 2.87 8.36 6.84 9.71.5.09.68-.22.68-.49 0-.24-.01-.89-.01-1.74-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.38 9.38 0 0 1 12 6.84c.85 0 1.7.12 2.5.35 1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.81-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.58.69.48A10.27 10.27 0 0 0 22 12.26C22 6.58 17.52 2 12 2Z"
            />
          </svg>
          GitHub
        </a>
        <a href="#" class="btn-social">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="#EA4335"
              d="M12 5c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 1.77 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.91 6.16-4.91Z"
            />
            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09Z"
            />
            <path
              fill="#FBBC05"
              d="M5.84 14.09A6.97 6.97 0 0 1 5.49 12c0-.72.13-1.43.35-2.09V7.07H2.18A10.97 10.97 0 0 0 1 12c0 1.77.43 3.45 1.18 4.93l3.66-2.84Z"
            />
            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23Z"
            />
          </svg>
          Google
        </a>
      </div>

      <p class="footer-text">
        Don't have an account? <a href="#" class="link">Create account</a>
      </p>
    </main>
  </body>
</html>
